[pytest]
# 只有一个测试目录 tests/，其下两棵树的用例分开跑：
#   tests/root/        仓库根那棵树（Truck / VRU / 入口编排）—— 原地跑
#   tests/main_chain/  main_chain/ 那棵树（合并车链里 Car 的 step2~step5）—— 子进程跑
#                      （由 tests/root/test_main_chain_suite.py 自动挂上）
# 两棵树同名包内容不同，一个进程里只能有一棵生效，所以不能混在一个 session。
testpaths = tests/root
# 1) 子目录里存在同名测试文件（test_step2_stages.py 等）；默认的 prepend 导入模式
#    会因为模块重名直接报错，importlib 模式按路径生成模块名，允许重名。
# 2) openpcdet 环境里装了 ROS 的 pytest 插件（launch_testing / ament_*），它们会在
#    收集阶段把每个 .py 当 launch test 去 import，直接干扰本仓库测试，关掉。
addopts =
    --import-mode=importlib
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_lint
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_copyright
    -p no:ament_xmllint
